<!DOCTYPE html> 
<html lang="en"> 
  
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport"
          content="width=device-width, 
                   initial-scale=1.0"> 
    <title>Signable</title> 
    <link href= 
"https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" 
          rel="stylesheet"
        integrity= 
"sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" 
          crossorigin="anonymous"> 
    <link rel="stylesheet" 
          href="{{ url_for('static', filename='sidebar/sidebar.css') }}"> 
    <link rel="stylesheet" href= 
"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity= 
"sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" 
        referrerpolicy="no-referrer" /> 
</head> 
<style>
    h2 {
        text-align: center;
    }
</style>

<body> 
  
    <div id="total" class="container-fluid p-0 d-flex h-100">
        
        {% include 'sidebar.html' %}
  
        <div class="bg-light flex-fill"> 
            <div class="p-2 d-md-none d-flex text-white color"> 
                <a id="mobileshow" href="#" class="text-white" 
                   data-bs-toggle="offcanvas"
                   data-bs-target="#bdSidebar"> 
                    <i class="fa-solid fa-bars text-black"></i> 
                </a> 
                <span class="ms-3 text-black">Signable</span> 
                <div class="btn-group d-inline automargin font-size-dropdown   text-dark">
                    <button type="button" class="btn  dropdown-toggle dropdownstyles" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa fa-user "></i>
                        
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end 	">
                        <span class="dropdown-item"> <i class="fa fa-user "> </i> {{username}}  </span>
                        <a class="dropdown-item" id="adminButton" href="/admin">  <i class="fas fa-user-cog text-black pe-2" style="color: black;"></i>Admin</a>
                        <a class="dropdown-item" href="/logoutapp">  <i class="fas fa-sign-out-alt pe-2" style="color: black;"></i>Log Out</a>
                    </ul>
                  </div>
            </div> 
            <div class="p-4"> 
                <div class="btn-group d-inline-block makefloat font-size-dropdown   text-dark">
                    <button type="button" class="btn  dropdown-toggle dropdownstyles d-none d-md-block" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa fa-user "></i>
                        <span class="d-none d-lg-inline"> {{username}}  </span>
                    </button>
                    <span class="d-none d-md-block">
                    <ul class="dropdown-menu dropdown-menu-end ">
                        <span class="dropdown-item d-lg-none"> <i class="fa fa-user "> </i> {{username}}  </span>
                        <a class="dropdown-item" id="adminButton2" href="/admin">  <i class="fas fa-user-cog text-black pe-2" style="color: black;"></i>Admin</a>


                        <a class="dropdown-item" href="/logoutapp">  <i class="fas fa-sign-out-alt text-black pe-2" style="color: black;"></i>Log Out</a>

                        
                    </ul>
                </span>
                  </div>
                <br>
                <br>
                <div class="row"> 
                    <div class="col"> 
                        <h2 >Error: {{error}}</h2> 
                    </div> 
                </div> 
            </div> 
  
        </div> 
    </div> 
    <script>
        window.adminValue = "{{ admin }}";  // Set the value passed from the backend to a global variable
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src= "https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"> </script>
    <script 
          src="{{ url_for('static', filename='sidebar/sidebar.js') }}">  </script>

</body> 

  
</html>
